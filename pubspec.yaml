name: flutter_setup_clean_architectute
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Package Management.
  change_app_package_name: ^1.3.0

  # Dependency Injection / Service Locator.
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Functional Programming.
  fpdart: ^1.1.0

  # Immutable classes & code generation.
  freezed_annotation: ^2.4.4

  # State Management.
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  shared_preferences: ^2.5.3

  # UI & Theming.
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.1
  loader_overlay: ^4.0.1
  syncfusion_flutter_charts: ^28.1.35
  syncfusion_flutter_datepicker: ^28.1.37
  fluttertoast: ^8.2.12
  pinput: ^5.0.1

  # Asset Handling.
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  flutter_svg_provider: ^1.0.7
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  path_provider: ^2.1.4

  # Navigation & Routing.
  auto_route: ^9.3.0+1
  url_launcher: ^6.1.10
  dotted_border: ^2.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  latlong2: ^0.9.1
  http: ^1.2.2
  file_picker: ^8.1.2
  dotted_line: ^3.2.2
  skeletonizer: ^1.4.3

  # Image & File Processing.
  # flutter_image_compress: ^2.4.0
  share_plus: ^10.1.4

  # Additional UI Components.
  dropdown_search: ^6.0.1
  bloc: ^8.1.4
  flutter_time_picker_spinner: ^2.0.0
  table_calendar: ^3.1.3
  flutter_picker: ^2.1.0

  # chat grouped list
  grouped_list: ^6.0.0

  # Logging.
  logger: ^2.5.0

  # Permmision handler storage,lokasi,kamera dll
  permission_handler: ^11.4.0
  badges: ^3.1.2

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  oktoast: ^3.4.0
  dio: ^5.9.0
  print_bluetooth_thermal: ^1.1.6
  esc_pos_utils_plus: ^2.0.4
  flutter_secure_storage: ^9.2.2
  pos: ^0.3.10
  # flutter_statusbarcolor_ns: ^0.6.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ">=3.0.0 <4.0.0"
  flutter_test:
    sdk: flutter

  freezed: ^2.5.7
  icons_launcher: ^3.0.0

  # DI / Service locator
  injectable_generator: ^2.6.2

  # Assets
  # flutter_gen: ^5.5.0+1
  flutter_gen_runner: 5.13.0

  # Environment Variable Code Generation.
  envied_generator: ^1.1.1

  auto_route_generator: ^9.0.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/payment/
    - assets/icons/bank/
    - assets/icons/ewallet/
    - assets/icons/broken/
    - assets/icons/bold/
    - assets/images/logo/
    - assets/images/dummy/

    - assets/images/
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Nunito-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Nunito-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/Nunito-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Nunito-ExtraLight.ttf
          weight: 200
          style: normal
        - asset: assets/fonts/Nunito-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: assets/fonts/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
          style: normal
        - asset: assets/fonts/Nunito-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
